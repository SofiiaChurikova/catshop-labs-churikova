name: publish-lab-02

on:
  push:
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]
  pull_request:
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab-02/requirements*.txt
      - run: pip install -r lab-02/requirements.txt -r lab-02/requirements-dev.txt
      - run: pytest lab-02/tests -q

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/catshop-lab-02" >> "$GITHUB_OUTPUT"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lab-02
          cache-to: type=gha,scope=lab-02,mode=max

      - if: github.event_name != 'pull_request'
        run: echo "published ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: copy to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools create \
            -t "docker.io/${{ vars.DOCKERHUB_USER }}/catshop-lab-02:$GITHUB_SHA" \
            "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          echo "published docker.io/${{ vars.DOCKERHUB_USER }}/catshop-lab-02@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: pull exactly what was published
        run: |
          REF="${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}"
          docker pull -q "$REF"
          docker run -d -p 8080:8080 "$REF"
          for _ in $(seq 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/visits
