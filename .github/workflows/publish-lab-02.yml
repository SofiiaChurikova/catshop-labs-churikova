name: publish-lab-02

on:
  push:
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]
  pull_request:
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab-02/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/catshop-lab-02" >> "$GITHUB_OUTPUT"

      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lab-02
          cache-to: type=gha,scope=lab-02,mode=max

      - name: smoke test
        run: |
          docker run -d -p 8080:8080 "${{ steps.meta.outputs.image }}:$GITHUB_SHA"
          for _ in $(seq 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/visits

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: docker push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lab-02

      - if: github.event_name != 'pull_request'
        run: echo "published ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
